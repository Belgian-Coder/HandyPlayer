name: CI

# Runs the same validate.ps1 developers run locally (restore, build with warnings as errors, unit + headless UI tests)
# on all three desktop platforms. Live Handy device tests are excluded by validate.ps1.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # No lock files yet, so key the package cache on every file that declares package versions.
      - uses: actions/cache@v6
        with:
          path: .harness-cache/
          key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/Directory.Build.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-

      - name: Check harness command contracts
        shell: pwsh
        run: ./tests/Harness.Tests.ps1

      - name: Validate
        shell: pwsh
        run: ./validate.ps1 -Coverage

      - name: Upload test results, coverage and UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: |
            TestResults/
            tests/HandyPlaylistPlayer.UiTests/bin/Release/net11.0/ui-artifacts/
          if-no-files-found: ignore
          retention-days: 14
